<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">


    <!-- DaisyUI + TailwindCSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Azeret+Mono:ital,wght@0,100..900;1,100..900&family=Bangers&family=Bebas+Neue&family=Bitcount+Prop+Single+Ink:wght@100..900&family=Bungee&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Geist:wght@100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lobster&family=Manrope:wght@200..800&family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Playwrite+US+Modern:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Adding all themes -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>

</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">


    <header class=" sticky top-0 z-50 bg-base-200 border-b-2 border-gray-300">

        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
            <div class="left  flex gap-1">
                <img class="max-w-[60px] h-full" src="./assets/logo.png" alt="">
                <div class="balance-info">
                    <h2 class="text-2xl font-bold">$<span id="balance">45000</span></h2>
                    <p class="text-neutral/50">Availabe balance</p>
                </div>

            </div>

            <div class="right">
                <a href="/index.html" class="btn btn-soft"><i
                        class="fa-solid fa-arrow-right-from-bracket rotate-180"></i>
                    Logout</a>
            </div>
        </section>


    </header>


    <section class="w-11/12 mx-auto space-y-5">
        <h2 class="text-3xl font-bold py-10">Welcome to Pay<span class="text-primary">oo</span></h2>
        <p class="text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>


        <div class="buttons grid grid-cols-3 gap-3 ">
            <!-- বাটনে কিছু লিখলে সেটা সাধারণত ডিসপ্লে ফ্লেক্স করে দেয় । fix: flex-col  এবং daisyUI থেকে আসলে বাটনের একটা ফিক্সড height দেওয়া থাকে fix: h-full -->
            <button class="btn flex-col h-full py-4 btn-soft">
                <img src="./assets/opt-1.png" alt="">
                <p class="text-primary">Add Money</p>
            </button>

            <button class="btn flex-col h-full py-4 btn-soft">
                <img src="./assets/opt-2.png" alt="">
                <p class="text-primary">Cashout</p>
            </button>

            <button class="btn flex-col h-full py-4 btn-soft">
                <img src="./assets/opt-3.png" alt="">
                <p class="text-primary whitespace-nowrap">Transfer Money</p>
            </button>

            <button class="btn flex-col h-full py-4 btn-soft">
                <img src="./assets/opt-4.png" alt="">
                <p class="text-primary">Get Bonus</p>
            </button>

            <button class="btn flex-col h-full py-4 btn-soft">
                <img src="./assets/opt-5.png" alt="">
                <p class="text-primary">Pay Bill</p>
            </button>

            <button
                class="btn flex-col h-full py-5 btn-soft hover:border-primary transition-all duration-300 ease-in-out hover:scale-105">
                <img src="./assets/opt-1.png" alt="">
                <p class="text-primary">Transactions</p>
            </button>

        </div>
    </section>



    <section id="cashout" class="mx-auto  w-11/12 mt-5">
        <h2 class="text-xl font-bold mb-5">Cashout</h2>
        <!-- form -->
        <div class="card bg-base-100 w-full  mx-auto rounded-3xl">
            <div class="card-body">
                <fieldset class="fieldset">

                    <label class="label text-neutral font-bold">Agent Number</label>
                    <input id="cashout-number" maxlength="11" type="text"
                        class="input rounded-full w-full bg-base-200 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                        placeholder="Enter 11 digit number" value="01648771835" />

                    <br>

                    <label class="label text-neutral font-bold">Amout</label>
                    <input id="cashout-amount" type="number"
                        class="input rounded-full w-full bg-base-200 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                        placeholder="Enter amount to withdraw" />
                    <br>

                    <label class="label text-neutral font-bold">4 Digit Pin</label>
                    <input id="cashout-pin" maxlength="4" type="password" class="input rounded-full w-full bg-base-200
                    focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                        placeholder="Enter 4 Digit Pin" />
                    <!-- <div><a class="link link-hover">Forgot password?</a></div> -->
                    <button id="cashout-btn" class="btn btn-primary mt-4 rounded-full w-full">Withdraw Money</button>
                </fieldset>
            </div>
        </div>
    </section>










    <script src="script/cashout.js"></script>
</body>

</html>
